name: Distillation Fail-Safe Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  distill-failsafe:
    name: DistilBERT-base -> BERT-tiny smoke distillation
    runs-on: ubuntu-latest
    timeout-minutes: 600

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install distillkit transformers

      - name: Verify runtime imports
        run: |
          python - <<'PY'
          import importlib
          for package in ("distillkit", "transformers"):
              importlib.import_module(package)
          print("Dependency import check passed.")
          PY

      - name: Run truncated CPU distillation (OOM-safe)
        run: |
          python -m distillkit.train \
            --teacher_model distilbert-base-uncased \
            --student_model prajjwal1/bert-tiny \
            --dataset imdb \
            --max_steps 100 \
            --per_device_train_batch_size 1 \
            --gradient_accumulation_steps 8 \
            --no_cuda
